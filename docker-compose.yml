services:
  postgres:
    image: postgres:16-alpine
    container_name: arxatec_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arxatec
      POSTGRES_PASSWORD: arxatec
      POSTGRES_DB: arxatec_academy
    ports:
      - '5444:5432'
    volumes:
      - arxatec_academy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arxatec -d arxatec_academy']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  arxatec_academy_postgres_data:
    name: arxatec_academy_postgres_data
